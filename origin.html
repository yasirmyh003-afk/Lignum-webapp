<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Origin</title>
  <link rel="stylesheet" href="global.css" />
  <link rel="icon" type="image/png" sizes="32x32" href="icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icon.png">
<style>
  .page-row {
    align-items: center;
    margin-bottom: 26px;
  }

  .page-frame > section.card {
    background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
    border-radius: 22px;
    border: 1px solid #dbe4ee;
    box-shadow: 0 16px 45px rgba(15, 23, 42, 0.08);
    overflow: hidden;
    margin-bottom: 24px;
    padding: 28px;
  }

  .page-frame > section.card .card-pad {
    padding: 0;
    margin-bottom: 18px;
  }

  .page-frame > section.card .card-title-row {
    margin-bottom: 0;
  }

  .page-frame > section.card .card-title-row .icon {
    display: none;
  }

  .page-frame > section.card .card-title {
    width: 100%;
    display: block;
    background: linear-gradient(135deg, #156082 0%, #0f4a63 100%);
    color: #ffffff;
    border-radius: 14px;
    padding: 14px 18px;
    box-shadow: 0 10px 22px rgba(21, 96, 130, 0.16);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-size: 18px;
    font-weight: 900;
    text-align: center;
    box-sizing: border-box;
  }

  .table-toolbar {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 12px;
    margin: 18px 0;
  }

  .table-search-input {
    width: 320px;
    max-width: 100%;
    height: 46px;
    background: #ffffff;
    border: 1px solid #dbe4ee;
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 14px;
    font-weight: 700;
    color: #0f172a;
    outline: none;
    box-shadow: 0 6px 16px rgba(15, 23, 42, 0.04);
  }

  .table-search-input:focus {
    box-shadow: 0 0 0 2px rgba(21, 96, 130, 0.16);
  }

  .table-wrap {
    width: 100%;
    padding: 0 !important;
    margin: 0;
    overflow-x: auto;
    overflow-y: hidden;
    box-sizing: border-box;
    border-radius: 14px;
  }

  .table {
    width: max-content !important;
    min-width: 100% !important;
    border-collapse: separate !important;
    border-spacing: 0 !important;
    background: #ffffff;
    font-size: 13px;
    overflow: hidden;
    border-radius: 14px;
    table-layout: auto !important;
    border: 1px solid #dbe4ee;
    box-shadow: 0 8px 22px rgba(15, 23, 42, 0.04);
  }

  .table thead tr {
    background: #eef2f5 !important;
  }

  .table th {
    background: #eef2f5 !important;
    color: #475569 !important;
    padding: 12px 14px !important;
    text-align: left !important;
    font-size: 10px !important;
    font-weight: 900 !important;
    text-transform: uppercase !important;
    letter-spacing: 0.12em !important;
    border: 0 !important;
    white-space: nowrap !important;
    cursor: grab;
    user-select: none;
  }

  .table th.dragging,
  .column-config-item.dragging {
    opacity: 0.45;
  }

  .table th.drag-over {
    box-shadow: inset 3px 0 0 #156082;
  }

  .table td {
    padding: 11px 14px !important;
    border: 0 !important;
    border-bottom: 1px solid #e5e7eb !important;
    color: #0f172a !important;
    font-size: 13px !important;
    font-weight: 300 !important;
    background: #ffffff;
    vertical-align: middle;
    white-space: normal;
    line-height: 1.3;
  }

  .table tbody tr:nth-child(even) td {
    background: #f8fafc !important;
  }

  .table tbody tr:hover td {
    background: #f1f5f9 !important;
  }

  .editable-cell {
    min-width: 120px;
    outline: none;
    border-radius: 7px;
    padding: 7px 8px;
    min-height: 32px;
  }

  .editable-cell:hover {
    background: #f8fafc;
  }

  .editable-cell:focus {
    background: #ffffff;
    box-shadow: 0 0 0 2px rgba(21, 96, 130, 0.16);
  }

  .empty-row {
    padding: 24px !important;
    text-align: center !important;
    color: #64748b !important;
    background: #f8fafc !important;
    font-weight: 800 !important;
  }

  .columns-drawer .drawer-body {
    padding-top: 18px;
  }

  .column-config-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 12px;
  }

  .column-config-item {
    display: grid;
    grid-template-columns: 28px 1fr auto;
    align-items: center;
    gap: 10px;
    background: #ffffff;
    border: 1px solid #e5edf4;
    border-radius: 12px;
    padding: 11px 12px;
    box-shadow: 0 5px 14px rgba(15, 23, 42, 0.03);
    cursor: grab;
  }

  .column-config-item input {
    width: 16px;
    height: 16px;
  }

  .column-config-label {
    font-size: 13px;
    font-weight: 900;
    color: #0f172a;
  }

  .column-drag-handle {
    color: #94a3b8;
    font-weight: 900;
    letter-spacing: 0.1em;
  }

  .view-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    margin-top: 12px;
  }

  .saved-view-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 8px;
    align-items: center;
    background: #ffffff;
    border: 1px solid #e5edf4;
    border-radius: 12px;
    padding: 10px;
    margin-top: 10px;
  }

  .saved-view-name {
    font-size: 13px;
    font-weight: 900;
    color: #0f172a;
  }

  @media(max-width: 900px) {
    .page-row {
      align-items: flex-start;
      flex-direction: column;
    }

    .page-actions,
    .page-actions .btn {
      width: 100%;
    }

    .page-frame > section.card {
      padding: 20px;
    }

    .page-frame > section.card .card-title {
      font-size: 16px;
      padding: 13px 16px;
    }

    .table-toolbar {
      flex-direction: column;
      align-items: stretch;
    }

    .table-search-input,
    .table-toolbar .btn {
      width: 100%;
    }

    .table {
      min-width: 1900px !important;
    }
  }
</style>
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount" class="sidebar-mount"></div>

  <main class="page-shell">
    <div class="page-frame">
      <div class="page-row">
        <div class="page-hero" style="margin-bottom:0;">
          <h1>Origin</h1>
          <p>Manage origin pickup details used across truck release and operations.</p>
        </div>
        <div class="page-actions">
          <button class="btn btn-primary" onclick="addOriginRow()">+ Add Line</button>
          <button class="btn btn-secondary" onclick="loadOrigins()">Refresh</button>
          <button class="btn btn-secondary" onclick="openOriginColumnsDrawer()">Columns</button>
        </div>
      </div>

      <section class="card">
        <div class="card-pad" style="padding-bottom:12px;">
          <div class="card-title-row">
            <div class="card-title">Origin Table</div>
          </div>
          <div id="origin-status" class="inline-status"></div>
          <div class="table-toolbar">
            <input id="origin-search" class="table-search-input" placeholder="Search origin..." oninput="renderOriginRows()" />
          </div>
        </div>

        <div class="table-wrap">
          <table class="table" style="min-width:1900px;">
            <thead>
              <tr id="origin-head"></tr>
            </thead>
            <tbody id="origin-body"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>
</div>

<div class="drawer-overlay" id="origin-columns-overlay" onclick="closeOriginColumnsDrawer()"></div>
<div class="drawer columns-drawer" id="origin-columns-drawer">
  <div class="drawer-header">
    <div class="drawer-title">Column Views</div>
    <button class="btn btn-secondary" onclick="closeOriginColumnsDrawer()">Close</button>
  </div>

  <div class="drawer-body">
    <section class="card" style="margin-bottom:18px;">
      <div class="card-pad">
        <div class="card-title-row"><div class="card-title">Save Current View</div></div>
        <div class="view-row">
          <input id="origin-view-name" type="text" placeholder="Example: Operations View" />
          <button class="btn btn-primary" onclick="saveOriginView()">Save View</button>
        </div>
      </div>
    </section>

    <section class="card" style="margin-bottom:18px;">
      <div class="card-pad">
        <div class="card-title-row"><div class="card-title">Saved Views</div></div>
        <div id="origin-saved-views"></div>
      </div>
    </section>

    <section class="card">
      <div class="card-pad">
        <div class="card-title-row"><div class="card-title">Columns</div></div>
        <p class="muted" style="font-size:13px;font-weight:700;margin:0 0 12px;">Drag columns to reorder. Uncheck columns to hide them.</p>
        <div class="row-end" style="margin:0 0 12px;">
          <button class="btn btn-secondary btn-sm" onclick="showAllOriginColumns()">Show All</button>
          <button class="btn btn-secondary btn-sm" onclick="resetOriginColumns()">Reset Default</button>
        </div>
        <div id="origin-column-list" class="column-config-list"></div>
      </div>
    </section>
  </div>
</div>

<script src="layout.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
const originEditableColumns = [
  {"field": "inv", "label": "INV"},
  {"field": "origin", "label": "Origin"},
  {"field": "title", "label": "Title"},
  {"field": "address", "label": "Address"},
  {"field": "city", "label": "City"},
  {"field": "state", "label": "State"},
  {"field": "zip", "label": "Zip"},
  {"field": "phone", "label": "Phone"},
  {"field": "hours", "label": "Hours"},
  {"field": "note1", "label": "Note1"},
  {"field": "note2", "label": "Note2"}
];

const originViewColumns = [
  ...originEditableColumns,
  { field: "__updated_by", label: "Last Updated By", readonly: true }
];

const originDefaultColumnOrder = originViewColumns.map(col => col.field);
const originColumnStateKey = "origin_column_state_v1";
const originSavedViewsKey = "origin_saved_views_v1";

let originRows = [];
let originColumnOrder = [...originDefaultColumnOrder];
let originHiddenColumns = new Set();
let originDraggedColumn = null;

function setOriginStatus(message, type = "info") {
  const status = document.getElementById("origin-status");
  status.className = "inline-status show " + type;
  status.textContent = message;

  clearTimeout(status._timer);
  status._timer = setTimeout(() => {
    status.className = "inline-status";
    status.textContent = "";
  }, 2200);
}

function getOriginColumnByField(field) {
  return originViewColumns.find(col => col.field === field);
}

function loadOriginColumnState() {
  try {
    const raw = localStorage.getItem(originColumnStateKey);
    if (!raw) return;

    const state = JSON.parse(raw);
    const validFields = new Set(originDefaultColumnOrder);

    if (Array.isArray(state.order)) {
      const cleanOrder = state.order.filter(field => validFields.has(field));
      const missing = originDefaultColumnOrder.filter(field => !cleanOrder.includes(field));
      originColumnOrder = [...cleanOrder, ...missing];
    }

    if (Array.isArray(state.hidden)) {
      originHiddenColumns = new Set(state.hidden.filter(field => validFields.has(field)));
    }
  } catch (error) {
    console.warn("Column state load failed", error);
  }
}

function saveOriginColumnState() {
  localStorage.setItem(originColumnStateKey, JSON.stringify({
    order: originColumnOrder,
    hidden: Array.from(originHiddenColumns)
  }));
}

function getVisibleOriginColumns() {
  return originColumnOrder
    .map(field => getOriginColumnByField(field))
    .filter(Boolean)
    .filter(col => !originHiddenColumns.has(col.field));
}

function safeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function rowMatchesOriginSearch(row) {
  const q = document.getElementById("origin-search")?.value.trim().toLowerCase() || "";
  if (!q) return true;

  return originViewColumns.some(col => {
    if (col.field === "__updated_by") {
      return String(row.updated_by_name || row.created_by_name || "").toLowerCase().includes(q);
    }
    return String(row[col.field] ?? "").toLowerCase().includes(q);
  });
}

function renderOriginHead() {
  const head = document.getElementById("origin-head");
  const visible = getVisibleOriginColumns();

  head.innerHTML = "";

  visible.forEach(col => {
    const th = document.createElement("th");
    th.textContent = col.label + "  ↕";
    th.draggable = true;
    th.dataset.field = col.field;

    th.addEventListener("dragstart", function () {
      originDraggedColumn = col.field;
      th.classList.add("dragging");
    });

    th.addEventListener("dragend", function () {
      th.classList.remove("dragging");
      document.querySelectorAll("#origin-head th").forEach(x => x.classList.remove("drag-over"));
    });

    th.addEventListener("dragover", function (e) {
      e.preventDefault();
      th.classList.add("drag-over");
    });

    th.addEventListener("dragleave", function () {
      th.classList.remove("drag-over");
    });

    th.addEventListener("drop", function (e) {
      e.preventDefault();
      th.classList.remove("drag-over");
      moveOriginColumn(originDraggedColumn, col.field);
    });

    head.appendChild(th);
  });

  const actionTh = document.createElement("th");
  actionTh.textContent = "Actions";
  actionTh.style.cursor = "default";
  head.appendChild(actionTh);
}

function renderOriginRows() {
  renderOriginHead();

  const tbody = document.getElementById("origin-body");
  const visible = getVisibleOriginColumns();
  const rows = (originRows || []).filter(rowMatchesOriginSearch);

  tbody.innerHTML = "";

  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="${visible.length + 1}" class="empty-row">No records found.</td></tr>`;
    return;
  }

  rows.forEach(row => {
    const tr = document.createElement("tr");

    visible.forEach(col => {
      const td = document.createElement("td");

      if (col.field === "__updated_by") {
        td.textContent = row.updated_by_name || row.created_by_name || "";
      } else {
        const div = document.createElement("div");
        div.className = "editable-cell";
        div.contentEditable = "true";
        div.textContent = row[col.field] ?? "";

        div.addEventListener("blur", async function () {
          const newValue = div.textContent.trim();
          const oldValue = row[col.field] ?? "";
          if (String(newValue) === String(oldValue ?? "")) return;

          await updateOriginCell(row.id, col.field, newValue);
          row[col.field] = newValue || null;
        });

        div.addEventListener("keydown", function(e) {
          if (e.key === "Enter") {
            e.preventDefault();
            div.blur();
          }
        });

        td.appendChild(div);
      }

      tr.appendChild(td);
    });

    const actionTd = document.createElement("td");
    actionTd.innerHTML = `
      <button class="btn btn-danger btn-sm" onclick="deleteOriginRow('${row.id}')">
        Delete
      </button>
    `;
    tr.appendChild(actionTd);

    tbody.appendChild(tr);
  });
}

function moveOriginColumn(fromField, toField) {
  if (!fromField || !toField || fromField === toField) return;

  const fromIndex = originColumnOrder.indexOf(fromField);
  const toIndex = originColumnOrder.indexOf(toField);

  if (fromIndex < 0 || toIndex < 0) return;

  const [moved] = originColumnOrder.splice(fromIndex, 1);
  originColumnOrder.splice(toIndex, 0, moved);

  saveOriginColumnState();
  renderOriginRows();
  renderOriginColumnList();
}

function openOriginColumnsDrawer() {
  renderOriginColumnList();
  renderOriginSavedViews();
  document.getElementById("origin-columns-overlay").classList.add("open");
  document.getElementById("origin-columns-drawer").classList.add("open");
}

function closeOriginColumnsDrawer() {
  document.getElementById("origin-columns-overlay").classList.remove("open");
  document.getElementById("origin-columns-drawer").classList.remove("open");
}

function renderOriginColumnList() {
  const list = document.getElementById("origin-column-list");
  list.innerHTML = "";

  originColumnOrder.forEach(field => {
    const col = getOriginColumnByField(field);
    if (!col) return;

    const item = document.createElement("div");
    item.className = "column-config-item";
    item.draggable = true;
    item.dataset.field = field;

    item.innerHTML = `
      <input type="checkbox" ${!originHiddenColumns.has(field) ? "checked" : ""} />
      <div class="column-config-label">${safeHtml(col.label)}</div>
      <div class="column-drag-handle">⋮⋮</div>
    `;

    item.querySelector("input").addEventListener("change", function () {
      if (this.checked) {
        originHiddenColumns.delete(field);
      } else {
        originHiddenColumns.add(field);
      }

      saveOriginColumnState();
      renderOriginRows();
    });

    item.addEventListener("dragstart", function () {
      originDraggedColumn = field;
      item.classList.add("dragging");
    });

    item.addEventListener("dragend", function () {
      item.classList.remove("dragging");
    });

    item.addEventListener("dragover", function (e) {
      e.preventDefault();
    });

    item.addEventListener("drop", function (e) {
      e.preventDefault();
      moveOriginColumn(originDraggedColumn, field);
    });

    list.appendChild(item);
  });
}

function resetOriginColumns() {
  originColumnOrder = [...originDefaultColumnOrder];
  originHiddenColumns = new Set();
  saveOriginColumnState();
  renderOriginRows();
  renderOriginColumnList();
}

function showAllOriginColumns() {
  originHiddenColumns = new Set();
  saveOriginColumnState();
  renderOriginRows();
  renderOriginColumnList();
}

function getOriginSavedViews() {
  try {
    return JSON.parse(localStorage.getItem(originSavedViewsKey) || "[]");
  } catch (_) {
    return [];
  }
}

function saveOriginSavedViews(views) {
  localStorage.setItem(originSavedViewsKey, JSON.stringify(views));
}

function saveOriginView() {
  const input = document.getElementById("origin-view-name");
  const name = input.value.trim();

  if (!name) {
    setOriginStatus("Please enter a view name.", "error");
    return;
  }

  const views = getOriginSavedViews();
  const existingIndex = views.findIndex(v => v.name.toLowerCase() === name.toLowerCase());

  const view = {
    name,
    search: document.getElementById("origin-search")?.value || "",
    order: originColumnOrder,
    hidden: Array.from(originHiddenColumns),
    savedAt: new Date().toISOString()
  };

  if (existingIndex >= 0) {
    views[existingIndex] = view;
  } else {
    views.push(view);
  }

  saveOriginSavedViews(views);
  input.value = "";
  renderOriginSavedViews();
  setOriginStatus("View saved.", "success");
}

function applyOriginView(index) {
  const views = getOriginSavedViews();
  const view = views[index];
  if (!view) return;

  const validFields = new Set(originDefaultColumnOrder);
  const cleanOrder = (view.order || []).filter(field => validFields.has(field));
  const missing = originDefaultColumnOrder.filter(field => !cleanOrder.includes(field));

  originColumnOrder = [...cleanOrder, ...missing];
  originHiddenColumns = new Set((view.hidden || []).filter(field => validFields.has(field)));

  const search = document.getElementById("origin-search");
  if (search) search.value = view.search || "";

  saveOriginColumnState();
  renderOriginRows();
  renderOriginColumnList();
  setOriginStatus("View applied.", "success");
}

function deleteOriginView(index) {
  const views = getOriginSavedViews();
  views.splice(index, 1);
  saveOriginSavedViews(views);
  renderOriginSavedViews();
  setOriginStatus("View deleted.", "success");
}

function renderOriginSavedViews() {
  const wrap = document.getElementById("origin-saved-views");
  const views = getOriginSavedViews();

  if (!views.length) {
    wrap.innerHTML = `<div class="empty-note">No saved views yet.</div>`;
    return;
  }

  wrap.innerHTML = views.map((view, index) => `
    <div class="saved-view-row">
      <div class="saved-view-name">${safeHtml(view.name)}</div>
      <button class="btn btn-primary btn-sm" onclick="applyOriginView(${index})">Apply</button>
      <button class="btn btn-danger btn-sm" onclick="deleteOriginView(${index})">Delete</button>
    </div>
  `).join("");
}

document.addEventListener("DOMContentLoaded", async function () {
  await requireLogin();
  loadSidebar("origin");
  loadOriginColumnState();
  await loadOrigins();
});

async function loadOrigins() {
  const { data, error } = await supabaseClient
    .from("origins")
    .select("*")
    .order("created_at", { ascending: true });

  if (error) {
    console.error(error);
    setOriginStatus("Could not load Origin records.", "error");
    return;
  }

  originRows = data || [];
  renderOriginRows();
}

async function updateOriginCell(id, field, value) {
  const auditUser = await getAuditUser();

  const payload = {};
  payload[field] = value || null;
  payload.updated_by_name = auditUser.name;
  payload.updated_by_email = auditUser.email;

  const { error } = await supabaseClient
    .from("origins")
    .update(payload)
    .eq("id", id);

  if (error) {
    console.error(error);
    setOriginStatus("Update failed.", "error");
    return;
  }

  setOriginStatus("Origin updated.", "success");
}

async function addOriginRow() {
  const auditUser = await getAuditUser();
  const row = {};

  originEditableColumns.forEach(col => {
    row[col.field] = "";
  });

  row.created_by_name = auditUser.name;
  row.created_by_email = auditUser.email;
  row.updated_by_name = auditUser.name;
  row.updated_by_email = auditUser.email;

  const { error } = await supabaseClient
    .from("origins")
    .insert([row]);

  if (error) {
    console.error(error);
    setOriginStatus("Could not add line.", "error");
    return;
  }

  await loadOrigins();
  setOriginStatus("New line added.", "success");
}

async function deleteOriginRow(id) {
  const ok = confirm("Delete this row?");
  if (!ok) return;

  const { error } = await supabaseClient
    .from("origins")
    .delete()
    .eq("id", id);

  if (error) {
    console.error(error);
    setOriginStatus("Delete failed.", "error");
    return;
  }

  await loadOrigins();
  setOriginStatus("Row deleted.", "success");
}
</script>
</body>
</html>
