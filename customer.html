<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer</title>
  <link rel="stylesheet" href="global.css" />
  <link rel="icon" type="image/png" sizes="32x32" href="icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icon.png">
<style>
  .page-row {
    align-items: center;
    margin-bottom: 26px;
  }

  .page-frame > section.card {
    background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
    border-radius: 22px;
    border: 1px solid #dbe4ee;
    box-shadow: 0 16px 45px rgba(15, 23, 42, 0.08);
    overflow: hidden;
    margin-bottom: 24px;
    padding: 28px;
  }

  .page-frame > section.card .card-pad {
    padding: 0;
    margin-bottom: 18px;
  }

  .page-frame > section.card .card-title-row {
    margin-bottom: 0;
  }

  .page-frame > section.card .card-title-row .icon {
    display: none;
  }

  .page-frame > section.card .card-title {
    width: 100%;
    display: block;
    background: linear-gradient(135deg, #156082 0%, #0f4a63 100%);
    color: #ffffff;
    border-radius: 14px;
    padding: 14px 18px;
    box-shadow: 0 10px 22px rgba(21, 96, 130, 0.16);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-size: 18px;
    font-weight: 900;
    text-align: center;
    box-sizing: border-box;
  }

  .table-toolbar {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 12px;
    margin: 18px 0;
  }

  .table-search-input {
    width: 320px;
    max-width: 100%;
    height: 46px;
    background: #ffffff;
    border: 1px solid #dbe4ee;
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 14px;
    font-weight: 700;
    color: #0f172a;
    outline: none;
    box-shadow: 0 6px 16px rgba(15, 23, 42, 0.04);
  }

  .table-search-input:focus {
    box-shadow: 0 0 0 2px rgba(21, 96, 130, 0.16);
  }

  .table-wrap {
    width: 100%;
    padding: 0 !important;
    margin: 0;
    overflow-x: auto;
    overflow-y: hidden;
    box-sizing: border-box;
    border-radius: 14px;
  }

  .table {
    width: max-content !important;
    min-width: 100% !important;
    border-collapse: separate !important;
    border-spacing: 0 !important;
    background: #ffffff;
    font-size: 13px;
    overflow: hidden;
    border-radius: 14px;
    table-layout: auto !important;
    border: 1px solid #dbe4ee;
    box-shadow: 0 8px 22px rgba(15, 23, 42, 0.04);
  }

  .table thead tr {
    background: #eef2f5 !important;
  }

  .table th {
    background: #eef2f5 !important;
    color: #475569 !important;
    padding: 12px 14px !important;
    text-align: left !important;
    font-size: 10px !important;
    font-weight: 900 !important;
    text-transform: uppercase !important;
    letter-spacing: 0.12em !important;
    border: 0 !important;
    white-space: nowrap !important;
    cursor: grab;
    user-select: none;
  }

  .table th.dragging,
  .column-config-item.dragging {
    opacity: 0.45;
  }

  .table th.drag-over {
    box-shadow: inset 3px 0 0 #156082;
  }

  .table td {
    padding: 11px 14px !important;
    border: 0 !important;
    border-bottom: 1px solid #e5e7eb !important;
    color: #0f172a !important;
    font-size: 13px !important;
    font-weight: 300 !important;
    background: #ffffff;
    vertical-align: middle;
    white-space: normal;
    line-height: 1.3;
  }

  .table tbody tr:nth-child(even) td {
    background: #f8fafc !important;
  }

  .table tbody tr:hover td {
    background: #f1f5f9 !important;
  }

  .editable-cell {
    min-width: 120px;
    outline: none;
    border-radius: 7px;
    padding: 7px 8px;
    min-height: 32px;
  }

  .editable-cell:hover {
    background: #f8fafc;
  }

  .editable-cell:focus {
    background: #ffffff;
    box-shadow: 0 0 0 2px rgba(21, 96, 130, 0.16);
  }

  .empty-row {
    padding: 24px !important;
    text-align: center !important;
    color: #64748b !important;
    background: #f8fafc !important;
    font-weight: 800 !important;
  }

  .columns-drawer .drawer-body {
    padding-top: 18px;
  }

  .column-config-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 12px;
  }

  .column-config-item {
    display: grid;
    grid-template-columns: 28px 1fr auto;
    align-items: center;
    gap: 10px;
    background: #ffffff;
    border: 1px solid #e5edf4;
    border-radius: 12px;
    padding: 11px 12px;
    box-shadow: 0 5px 14px rgba(15, 23, 42, 0.03);
    cursor: grab;
  }

  .column-config-item input {
    width: 16px;
    height: 16px;
  }

  .column-config-label {
    font-size: 13px;
    font-weight: 900;
    color: #0f172a;
  }

  .column-drag-handle {
    color: #94a3b8;
    font-weight: 900;
    letter-spacing: 0.1em;
  }

  .view-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    margin-top: 12px;
  }

  .saved-view-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 8px;
    align-items: center;
    background: #ffffff;
    border: 1px solid #e5edf4;
    border-radius: 12px;
    padding: 10px;
    margin-top: 10px;
  }

  .saved-view-name {
    font-size: 13px;
    font-weight: 900;
    color: #0f172a;
  }

  @media(max-width: 900px) {
    .page-row {
      align-items: flex-start;
      flex-direction: column;
    }

    .page-actions,
    .page-actions .btn {
      width: 100%;
    }

    .page-frame > section.card {
      padding: 20px;
    }

    .page-frame > section.card .card-title {
      font-size: 16px;
      padding: 13px 16px;
    }

    .table-toolbar {
      flex-direction: column;
      align-items: stretch;
    }

    .table-search-input,
    .table-toolbar .btn {
      width: 100%;
    }

    .table {
      min-width: 2550px !important;
    }
  }
</style>
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount" class="sidebar-mount"></div>

  <main class="page-shell">
    <div class="page-frame">
      <div class="page-row">
        <div class="page-hero" style="margin-bottom:0;">
          <h1>Customer</h1>
          <p>Manage customer destination, notes, and email contacts.</p>
        </div>
        <div class="page-actions">
          <button class="btn btn-primary" onclick="addCustomerRow()">+ Add Line</button>
          <button class="btn btn-secondary" onclick="loadCustomers()">Refresh</button>
          <button class="btn btn-secondary" onclick="openCustomerColumnsDrawer()">Columns</button>
        </div>
      </div>

      <section class="card">
        <div class="card-pad" style="padding-bottom:12px;">
          <div class="card-title-row">
            <div class="card-title">Customer Table</div>
          </div>
          <div id="customer-status" class="inline-status"></div>
          <div class="table-toolbar">
            <input id="customer-search" class="table-search-input" placeholder="Search customer..." oninput="renderCustomerRows()" />
          </div>
        </div>

        <div class="table-wrap">
          <table class="table" style="min-width:2550px;">
            <thead>
              <tr id="customer-head"></tr>
            </thead>
            <tbody id="customer-body"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>
</div>

<div class="drawer-overlay" id="customer-columns-overlay" onclick="closeCustomerColumnsDrawer()"></div>
<div class="drawer columns-drawer" id="customer-columns-drawer">
  <div class="drawer-header">
    <div class="drawer-title">Column Views</div>
    <button class="btn btn-secondary" onclick="closeCustomerColumnsDrawer()">Close</button>
  </div>

  <div class="drawer-body">
    <section class="card" style="margin-bottom:18px;">
      <div class="card-pad">
        <div class="card-title-row"><div class="card-title">Save Current View</div></div>
        <div class="view-row">
          <input id="customer-view-name" type="text" placeholder="Example: Operations View" />
          <button class="btn btn-primary" onclick="saveCustomerView()">Save View</button>
        </div>
      </div>
    </section>

    <section class="card" style="margin-bottom:18px;">
      <div class="card-pad">
        <div class="card-title-row"><div class="card-title">Saved Views</div></div>
        <div id="customer-saved-views"></div>
      </div>
    </section>

    <section class="card">
      <div class="card-pad">
        <div class="card-title-row"><div class="card-title">Columns</div></div>
        <p class="muted" style="font-size:13px;font-weight:700;margin:0 0 12px;">Drag columns to reorder. Uncheck columns to hide them.</p>
        <div class="row-end" style="margin:0 0 12px;">
          <button class="btn btn-secondary btn-sm" onclick="showAllCustomerColumns()">Show All</button>
          <button class="btn btn-secondary btn-sm" onclick="resetCustomerColumns()">Reset Default</button>
        </div>
        <div id="customer-column-list" class="column-config-list"></div>
      </div>
    </section>
  </div>
</div>

<script src="layout.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
const customerEditableColumns = [
  {"field": "destination", "label": "Destination"},
  {"field": "title", "label": "Title"},
  {"field": "address", "label": "Address"},
  {"field": "city", "label": "City"},
  {"field": "state", "label": "State"},
  {"field": "zip", "label": "Zip"},
  {"field": "phone", "label": "Phone"},
  {"field": "hours", "label": "Hours"},
  {"field": "note1", "label": "Note1"},
  {"field": "note2", "label": "Note2"},
  {"field": "note3", "label": "Note3"},
  {"field": "email_1", "label": "Email 1"},
  {"field": "email_2", "label": "Email 2"},
  {"field": "email_3", "label": "Email 3"},
  {"field": "email_4", "label": "Email 4"}
];

const customerViewColumns = [
  ...customerEditableColumns,
  { field: "__updated_by", label: "Last Updated By", readonly: true }
];

const customerDefaultColumnOrder = customerViewColumns.map(col => col.field);
const customerColumnStateKey = "customer_column_state_v1";
const customerSavedViewsKey = "customer_saved_views_v1";

let customerRows = [];
let customerColumnOrder = [...customerDefaultColumnOrder];
let customerHiddenColumns = new Set();
let customerDraggedColumn = null;

function setCustomerStatus(message, type = "info") {
  const status = document.getElementById("customer-status");
  status.className = "inline-status show " + type;
  status.textContent = message;

  clearTimeout(status._timer);
  status._timer = setTimeout(() => {
    status.className = "inline-status";
    status.textContent = "";
  }, 2200);
}

function getCustomerColumnByField(field) {
  return customerViewColumns.find(col => col.field === field);
}

function loadCustomerColumnState() {
  try {
    const raw = localStorage.getItem(customerColumnStateKey);
    if (!raw) return;

    const state = JSON.parse(raw);
    const validFields = new Set(customerDefaultColumnOrder);

    if (Array.isArray(state.order)) {
      const cleanOrder = state.order.filter(field => validFields.has(field));
      const missing = customerDefaultColumnOrder.filter(field => !cleanOrder.includes(field));
      customerColumnOrder = [...cleanOrder, ...missing];
    }

    if (Array.isArray(state.hidden)) {
      customerHiddenColumns = new Set(state.hidden.filter(field => validFields.has(field)));
    }
  } catch (error) {
    console.warn("Column state load failed", error);
  }
}

function saveCustomerColumnState() {
  localStorage.setItem(customerColumnStateKey, JSON.stringify({
    order: customerColumnOrder,
    hidden: Array.from(customerHiddenColumns)
  }));
}

function getVisibleCustomerColumns() {
  return customerColumnOrder
    .map(field => getCustomerColumnByField(field))
    .filter(Boolean)
    .filter(col => !customerHiddenColumns.has(col.field));
}

function safeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function rowMatchesCustomerSearch(row) {
  const q = document.getElementById("customer-search")?.value.trim().toLowerCase() || "";
  if (!q) return true;

  return customerViewColumns.some(col => {
    if (col.field === "__updated_by") {
      return String(row.updated_by_name || row.created_by_name || "").toLowerCase().includes(q);
    }
    return String(row[col.field] ?? "").toLowerCase().includes(q);
  });
}

function renderCustomerHead() {
  const head = document.getElementById("customer-head");
  const visible = getVisibleCustomerColumns();

  head.innerHTML = "";

  visible.forEach(col => {
    const th = document.createElement("th");
    th.textContent = col.label + "  ↕";
    th.draggable = true;
    th.dataset.field = col.field;

    th.addEventListener("dragstart", function () {
      customerDraggedColumn = col.field;
      th.classList.add("dragging");
    });

    th.addEventListener("dragend", function () {
      th.classList.remove("dragging");
      document.querySelectorAll("#customer-head th").forEach(x => x.classList.remove("drag-over"));
    });

    th.addEventListener("dragover", function (e) {
      e.preventDefault();
      th.classList.add("drag-over");
    });

    th.addEventListener("dragleave", function () {
      th.classList.remove("drag-over");
    });

    th.addEventListener("drop", function (e) {
      e.preventDefault();
      th.classList.remove("drag-over");
      moveCustomerColumn(customerDraggedColumn, col.field);
    });

    head.appendChild(th);
  });

  const actionTh = document.createElement("th");
  actionTh.textContent = "Actions";
  actionTh.style.cursor = "default";
  head.appendChild(actionTh);
}

function renderCustomerRows() {
  renderCustomerHead();

  const tbody = document.getElementById("customer-body");
  const visible = getVisibleCustomerColumns();
  const rows = (customerRows || []).filter(rowMatchesCustomerSearch);

  tbody.innerHTML = "";

  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="${visible.length + 1}" class="empty-row">No records found.</td></tr>`;
    return;
  }

  rows.forEach(row => {
    const tr = document.createElement("tr");

    visible.forEach(col => {
      const td = document.createElement("td");

      if (col.field === "__updated_by") {
        td.textContent = row.updated_by_name || row.created_by_name || "";
      } else {
        const div = document.createElement("div");
        div.className = "editable-cell";
        div.contentEditable = "true";
        div.textContent = row[col.field] ?? "";

        div.addEventListener("blur", async function () {
          const newValue = div.textContent.trim();
          const oldValue = row[col.field] ?? "";
          if (String(newValue) === String(oldValue ?? "")) return;

          await updateCustomerCell(row.id, col.field, newValue);
          row[col.field] = newValue || null;
        });

        div.addEventListener("keydown", function(e) {
          if (e.key === "Enter") {
            e.preventDefault();
            div.blur();
          }
        });

        td.appendChild(div);
      }

      tr.appendChild(td);
    });

    const actionTd = document.createElement("td");
    actionTd.innerHTML = `
      <button class="btn btn-danger btn-sm" onclick="deleteCustomerRow('${row.id}')">
        Delete
      </button>
    `;
    tr.appendChild(actionTd);

    tbody.appendChild(tr);
  });
}

function moveCustomerColumn(fromField, toField) {
  if (!fromField || !toField || fromField === toField) return;

  const fromIndex = customerColumnOrder.indexOf(fromField);
  const toIndex = customerColumnOrder.indexOf(toField);

  if (fromIndex < 0 || toIndex < 0) return;

  const [moved] = customerColumnOrder.splice(fromIndex, 1);
  customerColumnOrder.splice(toIndex, 0, moved);

  saveCustomerColumnState();
  renderCustomerRows();
  renderCustomerColumnList();
}

function openCustomerColumnsDrawer() {
  renderCustomerColumnList();
  renderCustomerSavedViews();
  document.getElementById("customer-columns-overlay").classList.add("open");
  document.getElementById("customer-columns-drawer").classList.add("open");
}

function closeCustomerColumnsDrawer() {
  document.getElementById("customer-columns-overlay").classList.remove("open");
  document.getElementById("customer-columns-drawer").classList.remove("open");
}

function renderCustomerColumnList() {
  const list = document.getElementById("customer-column-list");
  list.innerHTML = "";

  customerColumnOrder.forEach(field => {
    const col = getCustomerColumnByField(field);
    if (!col) return;

    const item = document.createElement("div");
    item.className = "column-config-item";
    item.draggable = true;
    item.dataset.field = field;

    item.innerHTML = `
      <input type="checkbox" ${!customerHiddenColumns.has(field) ? "checked" : ""} />
      <div class="column-config-label">${safeHtml(col.label)}</div>
      <div class="column-drag-handle">⋮⋮</div>
    `;

    item.querySelector("input").addEventListener("change", function () {
      if (this.checked) {
        customerHiddenColumns.delete(field);
      } else {
        customerHiddenColumns.add(field);
      }

      saveCustomerColumnState();
      renderCustomerRows();
    });

    item.addEventListener("dragstart", function () {
      customerDraggedColumn = field;
      item.classList.add("dragging");
    });

    item.addEventListener("dragend", function () {
      item.classList.remove("dragging");
    });

    item.addEventListener("dragover", function (e) {
      e.preventDefault();
    });

    item.addEventListener("drop", function (e) {
      e.preventDefault();
      moveCustomerColumn(customerDraggedColumn, field);
    });

    list.appendChild(item);
  });
}

function resetCustomerColumns() {
  customerColumnOrder = [...customerDefaultColumnOrder];
  customerHiddenColumns = new Set();
  saveCustomerColumnState();
  renderCustomerRows();
  renderCustomerColumnList();
}

function showAllCustomerColumns() {
  customerHiddenColumns = new Set();
  saveCustomerColumnState();
  renderCustomerRows();
  renderCustomerColumnList();
}

function getCustomerSavedViews() {
  try {
    return JSON.parse(localStorage.getItem(customerSavedViewsKey) || "[]");
  } catch (_) {
    return [];
  }
}

function saveCustomerSavedViews(views) {
  localStorage.setItem(customerSavedViewsKey, JSON.stringify(views));
}

function saveCustomerView() {
  const input = document.getElementById("customer-view-name");
  const name = input.value.trim();

  if (!name) {
    setCustomerStatus("Please enter a view name.", "error");
    return;
  }

  const views = getCustomerSavedViews();
  const existingIndex = views.findIndex(v => v.name.toLowerCase() === name.toLowerCase());

  const view = {
    name,
    search: document.getElementById("customer-search")?.value || "",
    order: customerColumnOrder,
    hidden: Array.from(customerHiddenColumns),
    savedAt: new Date().toISOString()
  };

  if (existingIndex >= 0) {
    views[existingIndex] = view;
  } else {
    views.push(view);
  }

  saveCustomerSavedViews(views);
  input.value = "";
  renderCustomerSavedViews();
  setCustomerStatus("View saved.", "success");
}

function applyCustomerView(index) {
  const views = getCustomerSavedViews();
  const view = views[index];
  if (!view) return;

  const validFields = new Set(customerDefaultColumnOrder);
  const cleanOrder = (view.order || []).filter(field => validFields.has(field));
  const missing = customerDefaultColumnOrder.filter(field => !cleanOrder.includes(field));

  customerColumnOrder = [...cleanOrder, ...missing];
  customerHiddenColumns = new Set((view.hidden || []).filter(field => validFields.has(field)));

  const search = document.getElementById("customer-search");
  if (search) search.value = view.search || "";

  saveCustomerColumnState();
  renderCustomerRows();
  renderCustomerColumnList();
  setCustomerStatus("View applied.", "success");
}

function deleteCustomerView(index) {
  const views = getCustomerSavedViews();
  views.splice(index, 1);
  saveCustomerSavedViews(views);
  renderCustomerSavedViews();
  setCustomerStatus("View deleted.", "success");
}

function renderCustomerSavedViews() {
  const wrap = document.getElementById("customer-saved-views");
  const views = getCustomerSavedViews();

  if (!views.length) {
    wrap.innerHTML = `<div class="empty-note">No saved views yet.</div>`;
    return;
  }

  wrap.innerHTML = views.map((view, index) => `
    <div class="saved-view-row">
      <div class="saved-view-name">${safeHtml(view.name)}</div>
      <button class="btn btn-primary btn-sm" onclick="applyCustomerView(${index})">Apply</button>
      <button class="btn btn-danger btn-sm" onclick="deleteCustomerView(${index})">Delete</button>
    </div>
  `).join("");
}

document.addEventListener("DOMContentLoaded", async function () {
  await requireLogin();
  loadSidebar("customer");
  loadCustomerColumnState();
  await loadCustomers();
});

async function loadCustomers() {
  const { data, error } = await supabaseClient
    .from("customers")
    .select("*")
    .order("created_at", { ascending: true });

  if (error) {
    console.error(error);
    setCustomerStatus("Could not load Customer records.", "error");
    return;
  }

  customerRows = data || [];
  renderCustomerRows();
}

async function updateCustomerCell(id, field, value) {
  const auditUser = await getAuditUser();

  const payload = {};
  payload[field] = value || null;
  payload.updated_by_name = auditUser.name;
  payload.updated_by_email = auditUser.email;

  const { error } = await supabaseClient
    .from("customers")
    .update(payload)
    .eq("id", id);

  if (error) {
    console.error(error);
    setCustomerStatus("Update failed.", "error");
    return;
  }

  setCustomerStatus("Customer updated.", "success");
}

async function addCustomerRow() {
  const auditUser = await getAuditUser();
  const row = {};

  customerEditableColumns.forEach(col => {
    row[col.field] = "";
  });

  row.created_by_name = auditUser.name;
  row.created_by_email = auditUser.email;
  row.updated_by_name = auditUser.name;
  row.updated_by_email = auditUser.email;

  const { error } = await supabaseClient
    .from("customers")
    .insert([row]);

  if (error) {
    console.error(error);
    setCustomerStatus("Could not add line.", "error");
    return;
  }

  await loadCustomers();
  setCustomerStatus("New line added.", "success");
}

async function deleteCustomerRow(id) {
  const ok = confirm("Delete this row?");
  if (!ok) return;

  const { error } = await supabaseClient
    .from("customers")
    .delete()
    .eq("id", id);

  if (error) {
    console.error(error);
    setCustomerStatus("Delete failed.", "error");
    return;
  }

  await loadCustomers();
  setCustomerStatus("Row deleted.", "success");
}
</script>
</body>
</html>
